name: Publicar en GitHub Pages

# Cada push a main publica la app. También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar la app (sin README ni documentación)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js img fonts _site/
          touch _site/.nojekyll

      - name: Subir la app
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
